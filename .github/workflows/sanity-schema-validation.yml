name: Sanity schema validation

# Validate the complete Studio configuration on every pull request. This job is
# intentionally credential-free so it also runs for Dependabot and forked PRs.
on:
  pull_request:

# Cancel stale validation when a PR receives a newer commit.
concurrency:
  group: sanity-schema-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Sanity schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Studio requires Node 24.18+, independently of the Expo app's Node 22
      # minimum. Pin the version tracked by studio/.nvmrc.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: studio/.nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio dependencies
        run: npm ci

      # TypeScript catches invalid schema callbacks and configuration before the
      # Sanity validator evaluates the assembled workspace schema.
      - name: Typecheck Studio
        run: npm run typecheck

      - name: Validate schema
        run: npm run schema:validate -- --workspace preflight --level warning

      # A production build also evaluates custom tools and desk structure, which
      # catches runtime conflicts outside the schema declaration itself.
      - name: Build Studio
        run: npm run build
